name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # The reference is generated from the editor's source, so it goes stale
  # without anything here changing. Nothing else would ever notice.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  api-reference:
    name: API reference is current
    runs-on: ubuntu-latest
    steps:
      # Check out the site, the editor, and the dependency files named by the
      # editor's canonical API source registry.
      - uses: actions/checkout@v7
        with:
          path: lumine-code.github.io
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lumine-code.github.io/package-lock.json
      - id: api-source-refs
        name: Resolve pinned API source revisions
        working-directory: lumine
        shell: bash
        run: |
          node -e 'const dependencies = require("./package.json").dependencies; const name = "@lumine-code/event-kit"; const ref = dependencies[name]?.split("#")[1]; if (!ref) throw new Error(`Missing pinned dependency ${name}`); console.log(`event_kit=${ref}`);' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/event-kit
          path: event-kit
          ref: ${{ steps.api-source-refs.outputs.event_kit }}
          fetch-depth: 1
      - run: npm ci
        working-directory: lumine-code.github.io
      # Fails when the committed api/ no longer matches any registered source:
      # a changed doc comment, a new member, or a moved source line.
      - run: npm run docs:api:check -- --editor ../lumine
        working-directory: lumine-code.github.io

  logo:
    name: Logo matches the editor
    runs-on: ubuntu-latest
    steps:
      # This check reads two files and needs no dependencies, so it skips the
      # install entirely rather than sharing the job and waiting on one.
      - uses: actions/checkout@v7
        with:
          path: lumine-code.github.io
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # assets/ holds copies of the editor's app icon, and a copy is exactly the
      # thing that goes quietly stale: the previous one was a separate export of
      # the same drawing whose curves had already diverged from it.
      - run: npm run assets:check -- --editor ../lumine
        working-directory: lumine-code.github.io
